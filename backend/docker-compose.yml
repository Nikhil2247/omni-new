version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnicassion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnicassion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: omnicassion-dragonfly
    command: --default_lua_flags=allow-undeclared-keys
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.32.2
    container_name: omnicassion-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: your-meilisearch-api-key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  minio:
    image: minio/minio:latest
    container_name: omnicassion-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  dragonfly_data:
  meilisearch_data:
  minio_data:
