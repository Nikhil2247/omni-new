# ===========================================
# Omnicassion Application Only - Docker Compose
# ===========================================
# Use this when running with shared infrastructure (docker-compose.infra.yml)
#
# Prerequisites:
#   1. Start infrastructure: docker compose -f docker-compose.infra.yml --env-file .env.infra up -d
#   2. Ensure infra-network exists: docker network ls | grep infra-network
#
# Usage:
#   docker compose -f docker-compose.app.yml up -d
#
# This file contains only the application services (frontend + backend)
# and connects to the shared infrastructure network.
#
# Recommended Environment Variables (Coolify):
#   MINIO_PUBLIC_URL            - Public MinIO host reachable by browser (e.g. https://minio.your-domain.com)
#   NEXT_PUBLIC_MEDIA_DELIVERY  - auto | direct | proxy (recommended: direct)
#   NEXT_PUBLIC_CDN_ENABLED     - true/false
#   NEXT_PUBLIC_CDN_BASE_URL    - CDN origin/base URL if using CDN
#   NEXT_PUBLIC_GOOGLE_CLIENT_ID - Google OAuth Web client ID used by frontend button
#   NEXT_PUBLIC_GA_MEASUREMENT_ID - Google Analytics measurement ID
#   NEXT_PUBLIC_GOOGLE_ADS_ID   - Google Ads conversion ID
#   NEXT_PUBLIC_ADSENSE_CLIENT_ID - Google AdSense client ID
#   GOOGLE_CLIENT_ID            - Google OAuth Web client ID used by backend token verification
#   GOOGLE_CLIENT_SECRET        - Google OAuth client secret used by backend config guard

services:
  # ===========================================
  # Frontend - Next.js (Standalone)
  # ===========================================
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-nikhil2247/omni-new}/frontend:latest
    container_name: omnicassion-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      - NEXT_PUBLIC_GOOGLE_ADS_ID=${NEXT_PUBLIC_GOOGLE_ADS_ID:-}
      - NEXT_PUBLIC_ADSENSE_CLIENT_ID=${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://backend.omnicassion.com/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-https://backend.omnicassion.com}
      - NEXT_PUBLIC_SOCKET_PATH=${NEXT_PUBLIC_SOCKET_PATH:-/api/socket.io}
      - NEXT_PUBLIC_MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-}
      - NEXT_PUBLIC_MINIO_BUCKET=${MINIO_DEFAULT_BUCKET:-omnicassion}
      - NEXT_PUBLIC_MEDIA_DELIVERY=${NEXT_PUBLIC_MEDIA_DELIVERY:-auto}
      - NEXT_PUBLIC_CDN_ENABLED=${NEXT_PUBLIC_CDN_ENABLED:-false}
      - NEXT_PUBLIC_CDN_BASE_URL=${NEXT_PUBLIC_CDN_BASE_URL:-}
    networks:
      - infra-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omnicassion-frontend.rule=Host(`${FRONTEND_HOST:-omnicassion.com}`)"
      - "traefik.http.routers.omnicassion-frontend.entrypoints=https"
      - "traefik.http.routers.omnicassion-frontend.tls=true"
      - "traefik.http.routers.omnicassion-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.omnicassion-frontend.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================
  # Backend - NestJS
  # ===========================================
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-nikhil2247/omni-new}/backend:latest
    container_name: omnicassion-backend
    command: ["node", "dist/src/main.js"]
    ports:
      - "3001:6000"
    environment:
      # Core
      - NODE_ENV=production
      - PORT=6000
      - BACKEND_PORT=6000
      # Database - connects to shared PostgreSQL
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@infra-postgres:5432/${POSTGRES_DB:-omnicassion}
      # Cache - connects to shared Dragonfly
      - REDIS_URL=redis://infra-dragonfly:6379
      - REDIS_HOST=infra-dragonfly
      - REDIS_PORT=6379
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-30m}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # CORS
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://omnicassion.com,https://www.omnicassion.com,https://backend.omnicassion.com}
      - SOCKET_IO_PATH=${SOCKET_IO_PATH:-/api/socket.io}
      # File Storage - connects to shared MinIO
      - MINIO_ENDPOINT=infra-minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      # Public URL reachable by browsers (fixes presigned upload/preview when MINIO_ENDPOINT is internal)
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-}
      - MINIO_DEFAULT_BUCKET=${MINIO_DEFAULT_BUCKET:-omnicassion}
      - MINIO_BUCKET=${MINIO_DEFAULT_BUCKET:-omnicassion}
      - MINIO_AUTO_SET_PUBLIC_READ=true
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_REGION=us-east-1
      # Meilisearch
      - MEILISEARCH_HOST=http://infra-meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      # Node.js memory optimization
      - NODE_OPTIONS=--max-old-space-size=512
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    networks:
      - infra-network
      - coolify
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.omnicassion-backend.rule=Host(`${BACKEND_HOST:-backend.omnicassion.com}`)"
      - "traefik.http.routers.omnicassion-backend.entrypoints=https"
      - "traefik.http.routers.omnicassion-backend.tls=true"
      - "traefik.http.routers.omnicassion-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.omnicassion-backend.loadbalancer.server.port=6000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 384M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  infra-network:
    external: true
    name: infra-network
  coolify:
    external: true
    name: coolify

volumes:
  backend-uploads:
    name: omnicassion-backend-uploads
  backend-logs:
    name: omnicassion-backend-logs
