# ===========================================
# Shared Infrastructure - Low Resource Mode
# ===========================================
# PostgreSQL + Dragonfly (Redis) + MinIO + Meilisearch
# Optimized for 5GB RAM total with strict CPU limits
#
# Resource Allocation (5GB total):
#   - PostgreSQL:   2GB    | 1.0 CPU
#   - Dragonfly:    1GB    | 0.5 CPU (single thread)
#   - MinIO:        768MB  | 0.5 CPU
#   - Meilisearch:  768MB  | 0.5 CPU
#   - System buffer: ~512MB
#   - Total CPU:    2.5 cores max
#
# Manual Deployment:
#   docker compose -f docker-compose.infra.yml up -d
#
# Connecting from other services:
#   - PostgreSQL: postgresql://postgres:password@infra-postgres:5432/app_db
#   - Dragonfly:  redis://infra-dragonfly:6379
#   - MinIO API:  http://infra-minio:9000
#   - MinIO Console: http://infra-minio:9001
#   - Meilisearch: http://infra-meilisearch:7700
# ===========================================

services:
  # ===========================================
  # PostgreSQL 18 - Primary Database
  # ===========================================
  postgres:
    image: postgres:18-alpine
    container_name: infra-postgres
    hostname: infra-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-}
    volumes:
      - infra-postgres-data:/var/lib/postgresql/data
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    command:
      - postgres
      # Memory settings (optimized for 2GB limit)
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      # WAL settings (reduced for lower memory)
      - -c
      - wal_buffers=8MB
      - -c
      - min_wal_size=256MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_completion_target=0.9
      # Connection settings (reduced)
      - -c
      - max_connections=100
      - -c
      - superuser_reserved_connections=3
      # Performance settings
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=100
      - -c
      - default_statistics_target=100
      # Disable huge pages (saves memory overhead)
      - -c
      - huge_pages=off
      # Logging (minimal)
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_checkpoints=off
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      # Autovacuum (single worker to save CPU)
      - -c
      - autovacuum_max_workers=1
      - -c
      - autovacuum_naptime=60s
      # Reduce parallel query workers
      - -c
      - max_parallel_workers_per_gather=1
      - -c
      - max_parallel_workers=2
      - -c
      - max_worker_processes=4

  # ===========================================
  # DragonflyDB - Redis-compatible Cache
  # Single-threaded mode for low CPU usage
  # ===========================================
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: infra-dragonfly
    hostname: infra-dragonfly
    ports:
      - "6379:6379"
    volumes:
      - infra-dragonfly-data:/data
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M
    ulimits:
      memlock: -1
    command: >
      --logtostderr
      --cache_mode=true
      --maxmemory=800mb
      --proactor_threads=1
      --keys_output_limit=512
      --default_lua_flags=allow-undeclared-keys
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ===========================================
  # MinIO - S3-compatible Object Storage
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: infra-minio
    hostname: infra-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      # Limit MinIO's internal concurrency
      GOMAXPROCS: "1"
    volumes:
      - infra-minio-data:/data
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 128M
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================
  # MinIO Init - Creates default buckets
  # ===========================================
  minio-init:
    image: minio/mc:latest
    container_name: infra-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - infra-network
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-omnicassion}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sleep 3
        echo "Configuring MinIO..."
        mc alias set myminio http://infra-minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}

        # Create buckets from comma-separated list
        IFS=',' read -ra BUCKETS <<< "$${MINIO_DEFAULT_BUCKETS}"
        for bucket in "$${BUCKETS[@]}"; do
          bucket=$$(echo "$$bucket" | xargs)
          if [ -n "$$bucket" ]; then
            echo "Creating bucket: $$bucket"
            mc mb myminio/$$bucket --ignore-existing
            mc anonymous set download myminio/$$bucket
            echo "Set public download policy for: $$bucket"
          fi
        done

        echo "MinIO initialization complete."
        mc admin info myminio

  # ===========================================
  # Meilisearch - Full-text Search Engine
  # ===========================================
  meilisearch:
    image: getmeili/meilisearch:${MEILISEARCH_IMAGE_TAG:-v1.35.0}
    container_name: infra-meilisearch
    hostname: infra-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey123456789}
      MEILI_ENV: ${MEILI_ENV:-production}
      MEILI_NO_ANALYTICS: "true"
      # Limit indexing threads
      MEILI_MAX_INDEXING_THREADS: "1"
      MEILI_MAX_INDEXING_MEMORY: "512MiB"
    volumes:
      - infra-meilisearch-data:/meili_data
    networks:
      - infra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  infra-network:
    driver: bridge
    name: infra-network

volumes:
  infra-postgres-data:
    name: infra-postgres-data
  infra-dragonfly-data:
    name: infra-dragonfly-data
  infra-minio-data:
    name: infra-minio-data
  infra-meilisearch-data:
    name: infra-meilisearch-data
